<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعليقات kkcaffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#1f2a27; --muted:#66736e; --line:#dbe1dd;
  --accent:#0f6b5c; --accent-soft:#dcefe9;
  --pos:#2e7d4f; --neg:#b86e0a; --crit:#b3261e;
  --pos-soft:#e1f1e6; --neg-soft:#f8ecd6; --crit-soft:#f8e0de;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131917; --panel:#1b2320; --ink:#e7eeea; --muted:#93a39c; --line:#2b3632;
    --accent:#4cc3aa; --accent-soft:#1d3a33;
    --pos:#6fcf94; --neg:#e3a24a; --crit:#ff7b72;
    --pos-soft:#1b3326; --neg-soft:#3a2d16; --crit-soft:#3c1f1d;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.5rem;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.refresh{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:500}
.refresh[disabled]{opacity:.6;cursor:wait}
@media (prefers-color-scheme: dark){.refresh{color:#0d1412}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.92rem}
.tab b{font-weight:600;margin-inline-start:6px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.posts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.posts .hint{color:var(--muted);font-size:.88rem;margin-inline-end:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.9rem}
.chip small{color:var(--muted);margin-inline-start:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.col-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.col-head h2{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rename{background:none;border:0;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:0}
.mini{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.col-body{max-height:64vh;overflow:auto}
.row{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;border-inline-start:4px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row.positive{border-inline-start-color:var(--pos)}
.row.negative{border-inline-start-color:var(--neg)}
.row.critical{border-inline-start-color:var(--crit)}
.row .top{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;color:var(--muted)}
.row .user{font-weight:600;color:var(--ink);direction:ltr;unicode-bidi:plaintext}
.row .text{margin:4px 0 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.done .text,.done .user{opacity:.5}
.badge{display:inline-block;font-size:.8rem;padding:1px 10px;border-radius:999px;font-weight:500}
.badge.positive{background:var(--pos-soft);color:var(--pos)}
.badge.negative{background:var(--neg-soft);color:var(--neg)}
.badge.critical{background:var(--crit-soft);color:var(--crit)}
.badge.auto{background:#e8f0fe;color:#1a56db;border:1px solid #c3d4fd}
.badge.manual{background:#f3f4f6;color:#66736e;border:1px solid var(--line)}
.badge.telegram{background:#f8e0de;color:#b3261e}
dialog{width:min(560px,calc(100vw - 32px));border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:1.15rem;direction:ltr;text-align:right;unicode-bidi:plaintext}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-bottom:16px}
.quote{font-size:1.15rem;margin:0 0 18px;padding-inline-start:14px;border-inline-start:3px solid var(--line)}
.label{font-size:.85rem;color:var(--muted);margin:14px 0 4px}
.reply{width:100%;min-height:110px;resize:vertical;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0d1412}}
.alert{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--crit-soft);color:var(--crit);font-size:.92rem}
.empty,.notice{padding:28px 20px;text-align:center;color:var(--muted)}
.notice{background:var(--neg-soft);color:var(--neg);border-radius:10px;padding:10px 14px;margin-bottom:14px;text-align:start;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>تعليقات kkcaffee</h1>
      <p class="sub" id="updated">جارٍ التحميل…</p>
    </div>
    <button class="refresh" id="refresh">تحديث</button>
  </header>
  <div id="notice"></div>
  <div class="posts" id="posts"></div>
  <div class="tabs" id="tabs" role="group" aria-label="تصفية حسب التقييم"></div>
  <div class="cols" id="cols"></div>
</div>
<dialog id="dlg"></dialog>
<script>
// ضعي رابط الـ Production لـ webhook القراءة من n8n هنا.
// إذا تركتيه فاضي، بتظهر بيانات تجريبية للتصميم.
const API_URL = "https://dania04.app.n8n.cloud/webhook/comments";
const LABELS = { all:"الكل", positive:"إيجابي", negative:"سلبي", critical:"حرج" };
const MAX_POSTS = 3, NONE = "unknown";
const DEMO = [
  { username:"mohammad_ali", comment_text:"الأكل كان ساخن ولذيذ والخدمة ممتازة", sentiment:"positive", category:"food_quality", summary:"طعام وخدمة ممتازة", suggested_reply:"يسعدنا أن التجربة أعجبتك!", action_required:"auto_reply", comment_id:"d1", post_id:"111" },
  { username:"sara.k", comment_text:"التوصيل تأخر ساعة والقهوة وصلت باردة", sentiment:"negative", category:"delivery", summary:"تأخر التوصيل", suggested_reply:"نعتذر عن التأخير.", action_required:"manager_review", comment_id:"d2", post_id:"222" },
  { username:"omar_77", comment_text:"وجدت شعرة في الطلب", sentiment:"critical", category:"hygiene", summary:"شكوى نظافة", suggested_reply:"نعتذر بشدة، راسلنا على الخاص.", action_required:"escalate", comment_id:"d3", post_id:"222" },
  { username:"lina", comment_text:"جميل جداً", sentiment:"positive", category:"other", summary:"إعجاب", suggested_reply:"شكراً لك!", action_required:"auto_reply", confidence:98, should_auto_reply:true, reply_id:"1799701159111616", comment_id:"d4", post_id:"333" }
];
let items = [], filter = "all", current = null;
const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const done = new Set(store("done", []));
let pinned = store("pinned", []);
let names = store("names", {});
const $ = id => document.getElementById(id);
const save = () => { localStorage.setItem("done", JSON.stringify([...done])); localStorage.setItem("pinned", JSON.stringify(pinned)); localStorage.setItem("names", JSON.stringify(names)); };
const isAuto = r => {
  const a = String(r.action_required||'').toLowerCase();
  if (a === 'auto_reply') return true;
  if (r.should_auto_reply === true || String(r.should_auto_reply).toLowerCase() === 'true') return true;
  if (r.already_replied === true || String(r.already_replied).toLowerCase() === 'true') return true;
  if (r.reply_id && String(r.reply_id) !== 'N/A' && String(r.reply_id).trim() !== '') return true;
  return false;
};
const isTelegram = r => {
  const a = String(r.action_required||'').toLowerCase();
  if (a === 'escalate_to_manager') return true;
  if (r.send_telegram === true || String(r.send_telegram).toLowerCase() === 'true') return true;
  return false;
};
const autoLabel = r => isAuto(r) ? '🤖 Auto Reply' : (isTelegram(r) ? '🚨 Telegram' : '👀 بانتظار المراجعة');
const norm = s => ["positive","negative","critical"].find(k => String(s||"").toLowerCase().includes(k)) || "positive";
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const pid = r => (r.post_id && String(r.post_id) !== "N/A") ? String(r.post_id) : NONE;
const postName = id => names[id] || (id === NONE ? "تعليقات بدون بوست" : "بوست …" + id.slice(-5));
async function load(){
  $("refresh").disabled = true;
  $("notice").innerHTML = "";
  try{
    let data = DEMO;
    if(API_URL){
      const r = await fetch(API_URL);
      if(!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
      if(!Array.isArray(data)) data = data.data || [data];
    } else {
      $("notice").innerHTML = '<div class="notice">هاي بيانات تجريبية. حطي رابط n8n في <b>API_URL</b> لعرض التعليقات الحقيقية.</div>';
    }
    items = data
      .map((r,i) => ({ ...r, id: r.comment_id && r.comment_id !== "N/A" ? String(r.comment_id) : "row"+i, tone: norm(r.sentiment), post: pid(r) }))
      .filter(r => r.comment_text)
      .reverse();
    $("updated").textContent = "آخر تحديث " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    $("notice").innerHTML = '<div class="notice">تعذر جلب البيانات من n8n (' + esc(e.message) + '). تأكدي أن الـ workflow منشور وأن CORS مفعّل.</div>';
    $("updated").textContent = "فشل التحديث";
  }
  $("refresh").disabled = false;
  render();
}
// أحدث البوستات أولاً (حسب أحدث تعليق)
const allPosts = () => [...new Set(items.map(x => x.post))];
function shownPosts(){
  const all = allPosts();
  const valid = pinned.filter(p => all.includes(p));
  return valid.length ? valid : all.slice(0, MAX_POSTS);
}
function render(){
  const all = allPosts(), shown = shownPosts();
  $("posts").innerHTML = '<span class="hint">اختاري حتى ' + MAX_POSTS + ' بوستات:</span>' + all.map(p =>
    `<button class="chip" data-post="${esc(p)}" aria-pressed="${shown.includes(p)}">${esc(postName(p))}<small>${items.filter(x => x.post === p).length}</small></button>`).join("");
  const inShown = items.filter(x => shown.includes(x.post));
  const counts = { all: inShown.length };
  ["positive","negative","critical"].forEach(k => counts[k] = inShown.filter(x => x.tone === k).length);
  $("tabs").innerHTML = Object.keys(LABELS).map(k =>
    `<button class="tab" data-f="${k}" aria-pressed="${filter===k}">${LABELS[k]}<b>${counts[k]}</b></button>`).join("");
  $("cols").innerHTML = shown.length ? shown.map(p => {
    const mine = items.filter(x => x.post === p);
    const rows = mine.filter(x => filter === "all" || x.tone === filter);
    const c = k => mine.filter(x => x.tone === k).length;
    return `<section class="col">
      <div class="col-head">
        <h2><span>${esc(postName(p))}</span><button class="rename" data-rename="${esc(p)}">تسمية</button></h2>
        <div class="mini"><span class="badge positive">${c("positive")} إيجابي</span><span class="badge negative">${c("negative")} سلبي</span><span class="badge critical">${c("critical")} حرج</span></div>
      </div>
      <div class="col-body">${rows.length ? rows.map(x => `
        <button class="row ${x.tone} ${done.has(x.id)?"done":""}" data-id="${esc(x.id)}">
          <div class="top"><span class="user">${esc(x.username)}</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="badge ${x.tone}">${LABELS[x.tone]}</span><span class="badge ${isAuto(x) ? "auto" : (isTelegram(x) ? "telegram" : "manual")}">${autoLabel(x)}</span></span></div>
          <p class="text">${esc(x.comment_text)}</p>
        </button>`).join("") : '<div class="empty">ما في تعليقات بهالتصنيف.</div>'}</div>
    </section>`;
  }).join("") : '<div class="empty">ما في تعليقات لعرضها.</div>';
}
function openDetail(id){
  const x = items.find(i => i.id === id); if(!x) return;
  current = id;
  const needs = x.action_required && !["auto_reply","none","n/a"].includes(String(x.action_required).toLowerCase());
  $("dlg").innerHTML = `
    <h2>${esc(x.username)}</h2>
    <div class="meta"><span class="badge ${x.tone}">${LABELS[x.tone]}</span><span class="badge ${isAuto(x) ? "auto" : (isTelegram(x) ? "telegram" : "manual")}">${autoLabel(x)}</span><span>${esc(x.category || "")}</span><span>${esc(postName(x.post))}</span></div>
    <div class="meta"><span>Confidence: ${x.confidence !== undefined && x.confidence !== "" ? esc(String(x.confidence)) + "%" : "—"}</span><span>Action: ${esc(x.action_required || "")}</span>${x.reply_id ? `<span>Reply ID: ${esc(String(x.reply_id).slice(-6))}</span>` : ""}</div>
    ${isAuto(x) ? `<div class="notice" style="background:#e8f0fe;color:#1a56db">✅ هاد الكومنت انرد عليه تلقائي من الووركفلو (confidence ${esc(String(x.confidence ?? ""))}%). ما في داعي تردي عليه مرة تانية.</div>` : ""}
    <p class="quote">${esc(x.comment_text)}</p>
    ${x.summary ? `<div class="label">ملخص</div><div>${esc(x.summary)}</div>` : ""}
    <div class="label">الرد المقترح</div>
    <textarea class="reply" id="reply">${esc(x.suggested_reply)}</textarea>
    <div class="actions">
      <button class="btn primary" id="copy">نسخ الرد</button>
      <button class="btn" id="mark">${done.has(x.id) ? "إعادة فتح" : "تم التعامل معه"}</button>
      <button class="btn" id="close">إغلاق</button>
    </div>
    ${needs && x.tone !== "positive" ? `<div class="alert">يحتاج متابعة: ${esc(x.action_required)}</div>` : ""}`;
  $("dlg").showModal();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-f],[data-id],[data-post],[data-rename],#copy,#mark,#close,#refresh");
  if(t){
    if(t.dataset.f){ filter = t.dataset.f; render(); }
    else if(t.dataset.id){ openDetail(t.dataset.id); }
    else if(t.dataset.post){
      const p = t.dataset.post; let cur = shownPosts().slice();
      cur = cur.includes(p) ? cur.filter(x => x !== p) : [...cur, p].slice(-MAX_POSTS);
      pinned = cur; save(); render();
    }
    else if(t.dataset.rename){
      const n = prompt("اسم البوست:", names[t.dataset.rename] || "");
      if(n !== null){ names[t.dataset.rename] = n.trim(); save(); render(); }
    }
    else if(t.id === "refresh"){ load(); }
    else if(t.id === "close"){ $("dlg").close(); }
    else if(t.id === "copy"){
      navigator.clipboard.writeText($("reply").value).then(() => { t.textContent = "تم النسخ"; setTimeout(() => t.textContent = "نسخ الرد", 1500); });
    } else if(t.id === "mark"){
      done.has(current) ? done.delete(current) : done.add(current);
      save(); $("dlg").close(); render();
    }
  } else if(e.target === $("dlg")){ $("dlg").close(); }
});
load();
</script>
</body>
</html>
